<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0a0626" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="スロパレ" />
  <title>スロパレ</title>
  <meta name="description" content="オリジナル機種で遊ぶ、オフラインのスロットシミュレーター" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css?v=1" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="screenTitle" class="screen-title">ホーム</div>
      <div class="stat"><span class="ico star">★</span><b id="statStars">0</b></div>
      <div class="stat"><span class="ico coin">●</span><b id="statCoins">0</b></div>
      <div class="stat"><span class="ico mp">MP</span><b id="statMp">0/0</b></div>
    </header>
    <main id="view" aria-live="polite"></main>
    <nav id="nav" aria-label="メインメニュー">
      <button data-nav="home"><i>🏠</i>ホーム</button>
      <button data-nav="mypage"><i>👤</i>マイページ</button>
      <button data-nav="items"><i>🎒</i>アイテム</button>
      <button data-nav="gacha"><i>🎰</i>ガチャ</button>
      <button data-nav="shop"><i>🛒</i>ショップ</button>
      <button data-nav="missions"><i>📋</i>ミッション<span class="badge" id="badgeMission" hidden></span></button>
    </nav>
  </div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="./engine.js?v=1"></script>
  <script src="./app.js?v=1"></script>

</html>
